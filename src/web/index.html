<!DOCTYPE html>
<!--
  新前端（M1 骨架）：纯 HTML + 原生 ES 模块 + 手写 CSS。
  与旧前端并行的对照实现，跑在 8804，旧前端仍在 8803。
  五个区域的位置逐值对齐旧前端实测几何（1920x1080 量测）：
    顶栏 header  : top 0, 高 3rem, 全宽, z 40
    左栏 aside   : left 0, top 3rem, 底 4rem, 宽 19rem, z 30
    舞台 stage   : 铺满视口（旧版画布即铺满窗口，其余区域浮在它上层）, z 0
    右栏 aside   : right 0, top 3rem, 底 4rem, 宽 11rem, z 30
    底栏 footer  : 底部居中浮条, 宽 720px, 高 2.625rem, 距底 15px, z 40

  外观状态属性（由样式层定义，接线时只需在 <html> 上切换属性值）：
    data-cinema="on"  影院模式：隐藏顶栏与左右侧栏，只留舞台
    data-idle="on"    影院模式静止态：底部播放条淡出（配合 data-cinema="on"）
    data-left="off"   收起左栏（角色库）
    data-right="off"  收起右栏（控制面板）
  样式规则见 style.css 末尾「影院模式 / 侧栏收起」一节。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<!-- 关键：图标用内联 data URI，避免浏览器请求 /favicon.ico 产生 404（控制台零错误的必要条件） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<title>ModelStage</title>
<link rel="stylesheet" href="./style.css" />
<!-- 控件外观单独一个文件：拆分只为把单文件控制在 400 行内，职责见两文件头注释 -->
<link rel="stylesheet" href="./components.css" />
<!-- 右侧面板与播放条内部样式单独一个文件（M3），避免 components.css 超过 400 行 -->
<link rel="stylesheet" href="./panel/panel.css" />
</head>
<body>

<!-- ============ 舞台（第 3 区域）：铺满视口，棋盘格背景 ============ -->
<main id="stage" class="stage checkerboard" aria-label="舞台">
  <!-- M1 只放空画布占位；M4 在此挂 PIXI Application 渲染 Spine -->
  <canvas id="stage-canvas" class="stage-canvas"></canvas>
  <p id="stage-hint" class="stage-hint">M1 骨架 · 舞台渲染在 M4 接入</p>
</main>

<!-- ============ 顶栏（第 1 区域） ============ -->
<header id="app-header" class="app-header">
  <div class="brand">
    <!-- 品牌图标用内联 SVG（旧前端为 lucide sparkles）：不依赖系统字体，避免无字体环境渲染成豆腐块 -->
    <span id="brand-icon" class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" />
      </svg>
    </span>
    <span id="brand-title" class="brand-title">ModelStage</span>
  </div>
  <nav class="header-actions" aria-label="顶栏操作">
    <!-- 未接线的按钮一律 disabled 并标注待接线：不允许"看着能点却没反应" -->
    <button type="button" class="icon-btn" id="btn-import" disabled title="待接线（M3）：导入模型">导入</button>
    <button type="button" class="icon-btn" id="btn-shot" disabled title="待接线（M3）：截图导出">截图导出</button>
    <button type="button" class="icon-btn" id="btn-library" title="模型库（显示/隐藏左栏）">模型库</button>
    <button type="button" class="icon-btn" id="btn-menu" disabled title="待接线（M3）：右栏菜单">菜单</button>
    <button type="button" class="icon-btn" id="btn-cinema" disabled title="待接线（M6）：影院模式">影院模式</button>
    <button type="button" class="icon-btn" id="btn-fullscreen" title="全屏">全屏</button>
  </nav>
</header>

<!-- ============ 左栏（第 2 区域）：角色库三级树 ============ -->
<aside id="left-panel" class="panel panel-left" aria-label="角色库">
  <div class="panel-head">
    <span class="panel-title">角色库</span>
    <span class="panel-actions">
      <button type="button" class="mini-btn is-primary" id="btn-add-root" disabled
        title="待接线（M3）：浏览本机目录，添加资源根">选择目录</button>
      <button type="button" class="mini-btn" id="btn-collapse"
        title="只收起展开的树节点（面板保留；隐藏面板用顶栏「模型库」按钮）">收起</button>
    </span>
  </div>
  <div class="panel-count" id="roster-count">正在读取资源根…</div>
  <div class="panel-search">
    <input id="roster-search" type="search" autocomplete="off"
      placeholder="搜索角色 / 服装 / 变体…" aria-label="搜索角色、服装、变体" />
  </div>
  <!-- 三级树：资源根 → 角色 → 变体（首次展开某根才请求该根的模型清单） -->
  <div id="roster-list" class="panel-body roster-list" role="tree" aria-label="角色库" aria-live="polite">
    <p class="muted-hint">正在读取资源根…</p>
  </div>
</aside>

<!-- ============ 右栏（第 4 区域）：控制面板（M3 骨架，内容由 panel.js 渲染） ============ -->
<aside id="right-panel" class="panel panel-right" aria-label="控制面板">
  <div class="panel-head" id="panel-head"></div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<!-- ============ 底栏（第 5 区域）：播放条（M3 骨架，内容由 transport.js 渲染） ============ -->
<footer id="app-footer" class="app-footer" aria-label="播放控制"></footer>

<script type="module" src="./main.js"></script>
</body>
</html>
